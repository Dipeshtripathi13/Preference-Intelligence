[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "preference-intelligence-research"
version = "0.2.0"
description = "Reproducible experiment harness for cross-model preference personalization research"
readme = "experiments/experimental_design.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Preference Intelligence contributors"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema[format]>=4.23",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6"
]

[project.scripts]
pi-run-experiment = "preference_intelligence_research.cli:main"
pi-summarize = "preference_intelligence_research.statistics.summary:main"
pi-analyze-local-pilot = "preference_intelligence_research.analysis.local_pilot:main"

[tool.hatch.build.targets.wheel]
packages = ["src/preference_intelligence_research"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["preference_intelligence_research"]
mypy_path = "src"
