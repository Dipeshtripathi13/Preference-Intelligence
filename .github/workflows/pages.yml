name: Deploy Preference Intelligence to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - product/extension/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product/extension
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product/extension/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify and build
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Make the standalone playground the public landing page
        run: cp dist/demo.html dist/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: product/extension/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
